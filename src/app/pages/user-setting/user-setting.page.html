<ion-content [fullscreen]="true">
  <form [formGroup]="modifyForm">
    <ion-card>

      <h2 class="section-title">Gestionar usuario</h2>
      <div class="section-box">
        <ion-row>
          <ion-col>
            <app-input
              type="text"
              label="Name"
              placeholder="Enmanuel"
              labelPlacement="floating"
              [control]="name">
            </app-input>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col>
            <app-input
              type="text"
              label="Last name"
              placeholder="Caraballo"
              labelPlacement="floating"
              [control]="lastName">
            </app-input>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col>
            <app-select
              placeholder="Selecciona tu tipo de documento"
              [control]="documentType">
            </app-select>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col>
            <app-input
              type="text"
              label="Document number"
              placeholder="123128493...."
              labelPlacement="floating"
              [control]="documentNumber">
            </app-input>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col>
            <app-input
              type="email"
              label="Email"
              placeholder="exampleEmail@gmail.com"
              labelPlacement="floating"
              [control]="email">
            </app-input>
          </ion-col>
        </ion-row>
      </div>

      <h2 class="section-title">Modificar contraseña</h2>
      <div class="section-box">
        <ion-row>
          <ion-col>
            <app-input
              type="password"
              label="Password"
              placeholder="**************"
              labelPlacement="floating"
              [control]="password">
            </app-input>
          </ion-col>
        </ion-row>
      </div>

      <ion-row class="action-row">
        <ion-col>
          <app-button
            type="submit"
            color="primary"
            (click)="modifyUser()"
            value="Modificar">
          </app-button>
        </ion-col>
      </ion-row>

      <h2 class="section-title">Cerrar sesión</h2>
      <div class="section-box">
        <ion-row>
          <ion-col>
            <app-button
              type="submit"
              color="primary"
              (click)="logOut()"
              value="Salir">
            </app-button>
          </ion-col>
        </ion-row>
      </div>

    </ion-card>
  </form>

  <h2 class="section-title">Eliminar cuenta</h2>
  <div class="section-box danger">
    <app-button
      type="submit"
      color="danger"
      value="Delete user"
      (click)="deleteUser()">
    </app-button>
  </div>

  <div class="auth-footer">
    <a routerLink="/login">¿Ya tienes una cuenta? Inicia sesión.</a>
  </div>
</ion-content>
