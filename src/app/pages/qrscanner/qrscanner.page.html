<ion-header>
  <ion-toolbar color="tertiary">
    <ion-title>
      QRscanner
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">

  <div class="segment">

    <div class="segment-content">
      <img src="/assets/images/scan-qr.webp">

      <h6 class="scan-label">
        Scan or select an image of a QR code to get its value
      </h6>

      <ion-row>
        <ion-col size="6">

          <ion-button (click)="startScan()" class="submit" expand="block">
            Scan
            <ion-icon slot="end" name="scan-outline"></ion-icon>
          </ion-button>

        </ion-col>
        <ion-col size="6">

          <ion-button (click)="callPayPlugin()" class="submit" expand="block" [disabled]="disabled">
            Pay
            <ion-icon slot="end" name="cash-outline"></ion-icon>
          </ion-button>

        </ion-col>
      </ion-row>

      <ion-item class="result" *ngIf="scanResult" lines="none">
        <ion-label>
          <p>Scan Result</p>
          <div>{{scanResult}}</div>
        </ion-label>
      </ion-item>

    </div>

  </div>

  <app-tab> </app-tab>
</ion-content>
